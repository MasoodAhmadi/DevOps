stages:
  - build
  - test
  - deploy

# Global Docker image
image: docker:20.10.21

# Variables to configure Docker and Docker Compose
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "" # Disable TLS

# Docker-in-Docker service configuration
services:
  - name: docker:20.10.21-dind
    alias: docker-dind # Unique alias for Docker-in-Docker
    command: ["--tls=false", "--host", "tcp://0.0.0.0:2375"] # Disable TLS and bind to port
# Validate docker-compose.yml
validate:
  stage: build
  script:
    - echo "Validating docker-compose.yml..."
    - docker-compose -f docker-compose.yml config # This checks for configuration errors
  tags:
    - ansible
build:
  stage: build
  script:
    - echo "Building Docker images..."
    - docker-compose -f docker-compose.yml build
  tags:
    - ansible

test:
  stage: test
  script:
    - echo "Running tests..."
    - docker-compose -f docker-compose.yml up -d nginx # Specify the file directly if $COMPOSE_FILE is not defined
    - |
      echo "Waiting for Nginx to be ready..."
      until curl --silent --fail http://nginx:8198/fetch; do
        echo "Waiting for Nginx to respond on http://nginx:8198/fetch...";
        sleep 5;
      done
      echo "Nginx is ready!"
    - docker-compose -f docker-compose.yml run tests # Run the tests service
    - docker-compose -f docker-compose.yml logs nginx # Print nginx logs for debugging

  tags:
    - ansible
