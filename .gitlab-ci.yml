stages:
  - build
  - test
  - deploy

# Define a global Docker image for the entire pipeline
image: docker:20.10.21

# Variables to configure Docker and Docker Compose
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "tcp://docker:2375" # Use Docker in Docker (DinD)

# Build stage: Build the Docker image for NGINX application
build:
  stage: build
  image: docker:20.10.21
  services:
    - docker:20.10.21-dind # Docker-in-Docker service for building images
  script:
    - echo "Building the Docker image for the NGINX application..."
    - docker-compose build # Build the Docker image using docker-compose
  artifacts:
    expire_in: 1 hour
    paths:
      - docker-compose.yml # Store the docker-compose file as an artifact

# Test stage: Run basic tests (can include container checks, health checks)
test:
  stage: test
  image: docker:20.10.21
  services:
    - docker:20.10.21-dind # Docker-in-Docker service for running containers
  script:
    - echo "Running tests..."
    - docker-compose up -d # Start containers in detached mode
    - docker-compose ps # Check the status of services
    - echo "Running basic health checks..."
    - docker-compose exec nginx curl -f http://localhost # Check if NGINX is up
    - docker-compose down # Bring down the containers after tests
  artifacts:
    when: always
    paths:
      - test-reports/ # Store test results as artifacts

# Deploy stage: Deploy the application (start the NGINX container)
deploy:
  stage: deploy
  image: docker:20.10.21
  services:
    - docker:20.10.21-dind # Docker-in-Docker service for deploying
  script:
    - echo "Deploying the NGINX container..."
    - docker-compose up -d # Start the containers in detached mode
  only:
    - project # Deploy only when pushing to the `project` branch
