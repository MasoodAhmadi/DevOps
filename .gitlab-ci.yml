stages:
  - build
  - test
  - deploy

# Global Docker image
image: docker:20.10.21

# Variables to configure Docker and Docker Compose
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "" # Disable TLS

# Docker-in-Docker service configuration
services:
  - name: docker:20.10.21-dind
    alias: docker-dind # Unique alias for Docker-in-Docker
    command: ["--tls=false", "--host", "tcp://0.0.0.0:2375"] # Disable TLS and bind to port

build:
  stage: build
  script:
    - echo "Building Docker images..."
    - docker-compose -f docker-compose.yml build
  tags:
    - ansible

test:
  stage: test
  script:
    - echo "Waiting for Nginx to be fully ready..."
    - docker-compose -f $COMPOSE_FILE up -d nginx # Ensure nginx starts
    - >
      until curl --silent --fail http://nginx:8198/fetch; do
        echo "Waiting for nginx to be ready...";
        sleep 5;
      done
    - echo "Nginx is ready, running tests..."
    - docker-compose -f $COMPOSE_FILE run tests # Run the tests service
  after_script:
    - docker-compose -f $COMPOSE_FILE down # Clean up the containers after the test

deploy:
  stage: deploy
  script:
    - echo "Start the deploy environment"
    - docker-compose up -d
  tags:
    - ansible
