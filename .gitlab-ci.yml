stages:
  - build
  - test
  - deploy

# Define a global Docker image for the entire pipeline
image: docker:20.10.21

# Variables to configure Docker and Docker Compose
variables:
  DOCKER_HOST: "tcp://docker:2375" # Ensure the correct Docker host is used

# Build stage: Build the Docker images for all services in docker-compose.yml
build:
  stage: build
  image: docker:20.10.21
  services:
    - name: docker:20.10.21-dind
      alias: docker
      command: ["--privileged"]

  script:
    - echo "Checking the repository structure..."
    - ls -alh # List files in the repository to verify if docker-compose.yml is present
    - echo "Building the Docker images using docker-compose..."
    - docker-compose -f docker-compose.yml build # Explicitly reference docker-compose.yml
  artifacts:
    expire_in: 1 hour
    paths:
      - docker-compose.yml # Store docker-compose file as an artifact

# Test stage: Run basic tests (can include container checks, health checks)
test:
  stage: test
  image: docker:20.10.21
  services:
    - name: docker:20.10.21-dind
      alias: docker
      command: ["--privileged"]

  script:
    - echo "Starting test environment..."
    - docker-compose up -d # Start containers in detached mode
    - echo "Waiting for services to be ready..."
    - sleep 10 # Ensure services have started
    - docker-compose ps # Check the status of services
    - echo "Running basic health checks..."
    - docker-compose exec nginx curl -f http://localhost # Check if NGINX is up
    - docker-compose down # Bring down the containers after tests
  artifacts:
    when: always
    paths:
      - test-reports/ # Store test results as artifacts

# Deploy stage: Deploy the application (start the NGINX container)
deploy:
  stage: deploy
  image: docker:20.10.21
  services:
    - name: docker:20.10.21-dind
      alias: docker
      command: ["--privileged"]

  script:
    - echo "Starting containers in detached mode..."
    - docker-compose up -d # Start the containers in detached mode
  only:
    - project # Deploy only when pushing to the `project` branch
