stages:
  - build
  - test
  - deploy

# Define a global Docker image for the entire pipeline
image: docker:20.10.21

# Variables to configure Docker and Docker Compose
# variables:
#   DOCKER_DRIVER: overlay2
#   DOCKER_TLS_CERTDIR: "/certs"
#   DOCKER_HOST: "tcp://docker:2375" # Use Docker-in-Docker (DinD)

services:
  - name: docker:20.10.21-dinstages:
  - build
  - test
  - deploy

image: docker:20.10.21

services:
  - name: docker:20.10.21-dind
    alias: docker-dind
    command: ["--tls=false", "--host", "tcp://0.0.0.0:2375"]
    privileged: true  # Ensures Docker-in-Docker can run properly


variables:
  DOCKER_HOST: tcp://docker-dind:2375  # Match the alias
  DOCKER_TLS_CERTDIR: ""  # Disable TLS
  DOCKER_DRIVER: overlay2

build:
  stage: build
  script:
    - echo "Building Docker images..."
    - docker-compose -f docker-compose.yml build
  tags:
    - ansible  # Ensure your runner supports DinD

deploy:
  stage: deploy
  script:
    - echo "Deploying..."
    - docker-compose up -d
  tags:
    - ansibled
    alias: docker

services:
  - name: docker:20.10.21-dind
    alias: docker-dind  # Use a unique alias
    command: ["--tls=false", "--host", "tcp://0.0.0.0:2375"]  # Disable TLS and bind to port

# Build stage: Build the Docker images for all services in docker-compose.yml
build:
  stage: build
  image: docker:20.10.21
  script:
    - echo "Checking the repository structure..."
    - ls -alh # List files in the repository to verify if docker-compose.yml is present
    - echo "Building the Docker images using docker-compose..."
    - docker-compose -f docker-compose.yml build # Explicitly reference docker-compose.yml
  artifacts:
    expire_in: 1 hour
    paths:
      - docker-compose.yml # Store docker-compose file as an artifact
  tags:
    - ansible

deploy:
  stage: deploy
  image: docker:20.10.21
  script:
    - echo "Start the deploy environment"
    - docker-compose up -d
    - project
  tags:
    - ansible
