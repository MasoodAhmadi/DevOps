stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs" # Required for DinD
  DOCKER_HOST: "tcp://docker:2375" # Explicitly set Docker host

# Build stage: Build Docker images for your services
build:
  stage: build
  image: docker:20.10.21
  services:
    - docker:20.10.21-dind
  script:
    - echo "Building Docker images..."
    - docker-compose build
  artifacts:
    expire_in: 1 hour
    paths:
      - docker-compose.yml

# Test stage: Run your tests from the tests/ folder.
test:
  stage: test
  image: docker:20.10.21
  services:
    - docker:20.10.21-dind
  script:
    - echo "Starting test environment..."
    - docker-compose up -d
    - echo "Waiting for services to be ready..."
    - sleep 10 # Ensure services have started
    - docker-compose ps # Check the status of services
    - echo "Running API tests..."
    - chmod +x tests/run_tests.sh
    - ./tests/run_tests.sh
  artifacts:
    when: always
    paths:
      - test-reports/

# Deploy stage: Deploy the system (start containers in detached mode)
deploy:
  stage: deploy
  image: docker:20.10.21
  services:
    - docker:20.10.21-dind
  script:
    - echo "Starting containers in detached mode..."
    - docker-compose up -d
  only:
    - project # Only deploy when pushing to the master branch
