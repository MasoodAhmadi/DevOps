image: docker:latest

services:
  - name: docker:23.0.1-dind # Use Docker-in-Docker service
    alias: docker # Ensure the service is accessible as 'docker'
    command: ["--tls=false", "--host=tcp://0.0.0.0:2375"] # Fix HOST/PORT issue

# variables:
#   DOCKER_HOST: "tcp://docker:2375" # Ensure CI jobs use the right Docker daemon
#   DOCKER_TLS_CERTDIR: "" # Disable TLS to prevent connection issues
#   DOCKER_DRIVER: "overlay2"

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - unset DOCKER_HOST
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
    - docker-compose build # Build all services
  only:
    - project

test:
  stage: test
  script:
    - echo "Running test phase"
  only:
    - project

deploy:
  stage: deploy
  script:
    - docker-compose up -d
    - echo "Deployment completed!"
  dependencies:
    - build
  only:
    - project
