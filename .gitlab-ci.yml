stages:
  - build
  - test
  - deploy

# Global Docker image
image: docker:20.10.21

# Variables to configure Docker and Docker Compose
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "" # Disable TLS

# Docker-in-Docker service configuration
services:
  - name: docker:20.10.21-dind
    alias: docker-dind # Unique alias for Docker-in-Docker
    command: ["--tls=false", "--host", "tcp://0.0.0.0:2375"] # Disable TLS and bind to port

build:
  stage: build
  script:
    - echo "Building Docker images..."
    - docker-compose -f docker-compose.yml build
  tags:
    - ansible

test:
  stage: test
  image: node:21.6.2 # Match Node.js version used in local dev
  script:
    - echo "Checking files in the working directory..."
    # - docker ps
    - cd service2 # Change to the service2 directory
    - ls -al # List files to ensure we are in the right directory
    - ls -al # Check that package.json is in the service2 directory
    - npm install # Install dependencies for service2
    - echo "Starting Service2..."
    - docker-compose -f docker-compose.yml up -d service2 # Start Service2 in the background using Docker Compose
    - sleep 5 # Wait for Service2 to be ready
    - echo "Running tests..."
    - cd tests # Change to the service2 directory
    - npm test # Run the tests directly
    - docker-compose -f docker-compose.yml down # Stop the containers after testing
  tags:
    - ansible

deploy:
  stage: deploy
  script:
    - echo "Start the deploy environment"
    - docker-compose up -d
  tags:
    - ansible
