stages:
  - build
  - test
  - deploy

image: docker:20.10.21

services:
  - name: docker:20.10.21-dind
    alias: docker-dind # Unique alias
    command: ["--tls=false", "--host", "tcp://0.0.0.0:2375"] # Critical for DinD

variables:
  DOCKER_HOST: tcp://docker-dind:2375 # Match the alias
  DOCKER_TLS_CERTDIR: "" # Disable TLS
  DOCKER_DRIVER: overlay2

build:
  stage: build
  script:
    - echo "Building Docker images..."
    - docker-compose -f docker-compose.yml build
  tags:
    - ansible # Ensure your runner supports DinD

deploy:
  stage: deploy
  script:
    - echo "Deploying..."
    - docker-compose up -d
  tags:
    - ansible
