stages:
  - build
  - test
  - deploy

# Global Docker image
image: docker:20.10.21

# Variables to configure Docker and Docker Compose
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "" # Disable TLS

# Docker-in-Docker service configuration
services:
  - name: docker:20.10.21-dind
    alias: docker-dind # Unique alias for Docker-in-Docker
    command: ["--tls=false", "--host", "tcp://0.0.0.0:2375"] # Disable TLS and bind to port

build:
  stage: build
  script:
    - echo "Building Docker images..."
    - docker-compose -f docker-compose.yml build
  tags:
    - ansible

  tests:
    build:
      context: ./tests
      dockerfile: Dockerfile
    depends_on:
      - nginx # Ensure nginx starts before tests
    environment:
      - NODE_ENV=test
    command: ["npm", "test"]
    networks:
      - dev_network # Ensure tests and nginx are on the same network

deploy:
  stage: deploy
  script:
    - echo "Start the deploy environment"
    - docker-compose up -d
  tags:
    - ansible
