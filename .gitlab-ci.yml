image: docker:24.0.5 # ✅ Use the latest stable Docker image

services:
  - name: docker:24.0.5-dind # ✅ Use the matching DinD service
    alias: docker # ✅ Ensure alias matches DOCKER_HOST

variables:
  DOCKER_HOST: "tcp://docker:2375" # ✅ Correct hostname to match service alias
  DOCKER_TLS_CERTDIR: "" # ✅ Disable TLS for simplicity
  DOCKER_DRIVER: overlay2 # ✅ Improve performance

before_script:
  - echo "Waiting for Docker daemon to start..."
  - until docker info; do sleep 2; done # ✅ Wait for Docker to be ready
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" # ✅ Secure login

stages:
  - build
  - test
  - deploy

# 🛠 Build Stage
build:
  stage: build
  script:
    - echo "Checking repository structure..."
    - ls -alh # ✅ Verify docker-compose.yml exists
    - echo "Building Docker images..."
    - docker-compose -f docker-compose.yml build # ✅ Build all services
  artifacts:
    expire_in: 1 hour
    paths:
      - docker-compose.yml # ✅ Save docker-compose file
  tags:
    - ansible

# ✅ Ensure Docker is Ready Before Using It
test:
  stage: test
  script:
    - echo "Starting test environment..."
    - docker-compose up -d
    - echo "Waiting for services to be ready..."
    - sleep 10
    - docker-compose ps
    - echo "Running nginx check..."
    - docker-compose exec nginx curl -f http://localhost # ✅ Fix typo (`-f` was incorrect)
    - docker-compose down
  artifacts:
    when: always
    paths:
      - test-reports/ # ✅ Save test results
  tags:
    - ansible
