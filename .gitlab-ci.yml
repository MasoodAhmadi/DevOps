stages:
  - build
  - test
  - deploy

# Use the latest stable Docker image
image: docker:20.10.21

# Configure Docker-in-Docker (DinD) with the appropriate service
services:
  - name: docker:20.10.21-dind
    alias: docker
    # privileged: true # Enable privileged mode for Docker-in-Docker
    entrypoint: ["docker-entrypoint.sh"]

variables:
  # Docker configuration
  DOCKER_HOST: "tcp://docker:2375" # Ensure this matches the alias of the Docker service
  DOCKER_DRIVER: overlay2 # Use overlay2 for Docker storage driver
  DOCKER_TLS_CERTDIR: "" # Disable TLS for simplicity
  DOCKER_CLI_EXPERIMENTAL: "enabled" # Enable Docker experimental features (if needed)

before_script:
  # Ensure Docker is fully started and ready
  - echo "Waiting for Docker daemon to start..."
  - until docker info; do sleep 2; done # Wait until Docker is ready
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" # Secure login

build:
  stage: build
  script:
    - echo "Checking the repository structure..."
    - ls -alh # List files to ensure docker-compose.yml exists
    - echo "Building the Docker images using docker-compose..."
    - docker-compose -f docker-compose.yml build # Explicitly reference docker-compose.yml
  artifacts:
    expire_in: 1 hour
    paths:
      - docker-compose.yml # Store docker-compose file as an artifact
  tags:
    - ansible
