stages:
  - build
  - test
  - deploy

image: docker:20.10.21

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

services:
  - name: docker:20.10.21-dind
    alias: docker-dind
    command: ["--tls=false", "--host", "tcp://0.0.0.0:2375"]
build:
  stage: build
  script:
    - echo "Building Docker images..."
    - docker-compose -f docker-compose.yml build
    - docker images
    - docker-compose down

  tags:
    - ansible
test:
  stage: test
  services:
    - docker:dind
  script:
    - docker-compose --version
    - docker-compose ps
    - docker-compose -f docker-compose.yml up --scale test-service=0 -d # Start services in the background
    - docker-compose ps
    - docker-compose run -T test-service
    - docker-compose down
  only:
    - project
  tags:
    - ansible
