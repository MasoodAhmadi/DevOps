image: docker:latest

services:
  - name: docker:20.10.21-dind
    alias: docker # Ensure the service is accessible as 'docker'
    command: ["--tls=false", "--host=tcp://0.0.0.0:2375"] # Fix HOST/PORT issue

variables:
  DOCKER_HOST: "tcp://docker:2375" # Ensure CI jobs use the right Docker daemon
  DOCKER_TLS_CERTDIR: "" # Disable TLS to prevent connection issues
  DOCKER_DRIVER: "overlay2"

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - echo "Waiting for Docker to start..."
    - until docker info; do sleep 3; done # Wait until Docker is ready
    - echo "Docker is running!"
    - docker-compose build # Build all services
  only:
    - project

test:
  stage: test
  script:
    - echo "Running test phase"
  only:
    - project

deploy:
  stage: deploy
  script:
    - docker-compose up -d
    - echo "Deployment completed!"
  dependencies:
    - build
  only:
    - project
