stages:
  - build
  - test
  - deploy

# Global Docker image
image: docker:20.10.21

# Variables to configure Docker and Docker Compose
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "" # Disable TLS

# Docker-in-Docker service configuration
services:
  - name: docker:20.10.21-dind
    alias: docker-dind # Unique alias for Docker-in-Docker
    command: ["--tls=false", "--host", "tcp://0.0.0.0:2375"] # Disable TLS and bind to port
# Validate docker-compose.yml

build:
  stage: build
  script:
    - echo "Building Docker images..."
    - docker-compose -f docker-compose.yml build
  tags:
    - ansible

test:
  stage: test
  image: docker/compose:1.29.2
  services:
    - docker:dind
  script:
    - echo "Starting the test environment..."
    - docker-compose -f docker-compose.yml up -d
    - echo "Running tests..."
    - docker-compose -f docker-compose.yml run tests npm test
    - echo "Stopping the test environment..."
    - docker-compose -f docker-compose.yml down
  tags:
    - ansible
