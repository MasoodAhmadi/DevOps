image: docker:latest

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - docker-compose build # Build all services
  only:
    - project # Run this job only when the project is updated
test:
  stage: test
  script:
    - echo "test phase here"

  only:
    - project # Run this job only when the project is updated

deploy:
  stage: deploy
  script:
    - docker-compose up --build # Start all services
    - echo " deploy phase here"
  dependencies:
    - build
  only:
    - project # Run this job only when the project is updated
