stages:
  - build
  - test
  - deploy

# Global Docker image
image: docker:20.10.21

# Variables to configure Docker and Docker Compose
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "" # Disable TLS

# Docker-in-Docker service configuration
services:
  - name: docker:20.10.21-dind
    alias: docker-dind # Unique alias for Docker-in-Docker
    command: ["--tls=false", "--host", "tcp://0.0.0.0:2375"]
build:
  stage: build
  script:
    - echo "Building Docker images..."
    - docker-compose -f docker-compose.yml build
    - docker-compose down

  tags:
    - ansible
test:
  stage: test
  services:
    - docker:dind
  script:
    # Ensure Docker Compose is installed
    - docker-compose --version
    - docker-compose ps # Check that services are running
    - docker-compose -f docker-compose.yml up -d # Start services in the background
    - docker-compose exec -T test-service npm test # Run tests in the test service
    - docker-compose down # Stop and remove the containers
  only:
    - project
    - main # or any other branch where you want to run tests
  tags:
    - ansible
