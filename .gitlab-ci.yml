stages:
  - build
  - test
  - deploy

image: docker:20.10.21

# Variables to configure Docker and Docker Compose
services:
  - name: docker:20.10.21-dind
    alias: docker # Ensure the alias is correct

variables:
  DOCKER_HOST: "tcp://docker:2375" # This should be correct with alias 'docker'
  DOCKER_DRIVER: overlay2 # Use the overlayfs driver for improved performance
  DOCKER_TLS_CERTDIR: "" # Disable TLS for simplicity

before_script:
  - echo "Waiting for Docker daemon to start..."
  - until docker info; do sleep 2; done # Wait for Docker to be ready
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" # Secure login

# Build stage: Build the Docker images for all services in docker-compose.yml
build:
  stage: build
  image: docker:20.10.21
  script:
    - echo "Checking the repository structure..."
    - ls -alh # List files in the repository to verify if docker-compose.yml is present
    - echo "Building the Docker images using docker-compose..."
    - docker-compose -f docker-compose.yml build # Explicitly reference docker-compose.yml
  artifacts:
    expire_in: 1 hour
    paths:
      - docker-compose.yml # Store docker-compose file as an artifact
  tags:
    - ansible

test:
  stage: test
  image: docker:20.10.21
  script:
    - echo "Start the test environment"
    - docker-compose up -d
    - echo "Wait for services to be ready"
    - sleep 10
    - docker-compose ps
    - echo "Running nginx check"
    - docker-compose exec nginx curl -f http://localhost # Fixed the typo (`-f`)
    - docker-compose down
  artifacts:
    when: always
    paths:
      - test-reports/ # Store test results as artifacts
  tags:
    - ansible

deploy:
  stage: deploy
  image: docker:20.10.21
  script:
    - echo "Start the deploy environment"
    - docker-compose up -d
  tags:
    - ansible
