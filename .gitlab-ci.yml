image: docker:latest

services:
  - name: docker:20.10.21-dind
    command: ["--tls=false"] # Disable TLS to allow non-secure communication

variables:
  DOCKER_HOST: "tcp://docker:2375" # Use this to connect to DinD
  DOCKER_DRIVER: "overlay2"
  DOCKER_TLS_CERTDIR: "" # Important: Disable TLS if not using secure connection

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - echo "Waiting for Docker to start..."
    - until docker info; do sleep 1; done # Wait until Docker is up
    - echo "Docker is running!"
    - docker-compose build
  only:
    - project

test:
  stage: test
  script:
    - echo "Running test phase"
  only:
    - project

deploy:
  stage: deploy
  script:
    - docker-compose up -d
    - echo "Deployment completed!"
  dependencies:
    - build
  only:
    - project
