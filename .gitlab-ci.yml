image: docker:24.0.5
services:
  - name: docker:24.0.5-dind
    # Critical: Use IP instead of hostname
    command:
      - --tls=false
      - --host=tcp://0.0.0.0:2375

variables:
  # Explicitly use TCP connection without hostname
  DOCKER_HOST: tcp://127.0.0.1:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - test
  - deploy

# Build Stage
build:
  stage: build
  script:
    # Build Docker image using Dockerfile
    - docker-compose build

# Test Stage
test:
  stage: test
  script:
    - echo "test phase running"

  after_script:
    - docker-compose down

# Deploy Stage
deploy:
  stage: deploy
  script:
    - docker-compose down --remove-orphans
    - docker-compose up -d
