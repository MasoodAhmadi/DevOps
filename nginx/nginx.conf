worker_processes 1;

events {
  worker_connections 1024;
}

http {
  upstream service1_backend {
    server service1_instance1:3000;
    server service1_instance2:3000;
    server service1_instance3:3000;
  }

  server {
    listen 80;

    # Basic authentication
    auth_basic "Protected Area";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Load balancing for Service1
    location / {
      proxy_pass http://service1_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct requests to Service2
    location /service2 {
      proxy_pass http://service2:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
