worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream backend {
        # Docker Compose service names are used here.
        server service1_instance1:5000;
        server service1_instance2:5000;
        server service1_instance3:5000;
    }

    server {
        listen 80;

        # Enable basic authentication (ensure .htpasswd is valid)
        auth_basic "Protected Area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # All requests go to Service1 via load balancing
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optionally, you can add a location for Service2:
        location /service2 {
            proxy_pass http://service2:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
