version: "3.5"

services:
  service1_instance1:
    build:
      context: ./service1
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - NODE_ENV=development

  service1_instance2:
    build:
      context: ./service1
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - NODE_ENV=development

  service1_instance3:
    build:
      context: ./service1
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - NODE_ENV=development

  service2:
    build:
      context: ./service2
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NODE_ENV=development

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8198:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - service1_instance1
      - service1_instance2
      - service1_instance3
      - service2
  test-service:
    build:
      context: ./tests
      dockerfile: Dockerfile
    depends_on:
      - nginx
    environment:
      - API_URL=http://nginx/fetch
    volumes:
      - ./tests:/app
      - ./test-logs:/app/test-logs # Persist test results in a local directory
