version: "3.5"

services:
  service1_instance1:
    build:
      context: ./service1
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - NODE_ENV=development
    networks:
      - dev_network

  service1_instance2:
    build:
      context: ./service1
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - NODE_ENV=development
    networks:
      - dev_network

  service1_instance3:
    build:
      context: ./service1
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - NODE_ENV=development
    networks:
      - dev_network

  service2:
    build:
      context: ./service2
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NODE_ENV=development
    networks:
      - dev_network # Ensure service2 is on the same network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8198:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      - service1_instance1
      - service1_instance2
      - service1_instance3
      - service2
    networks:
      - dev_network # Ensure nginx is on the same network

  tests:
    build:
      context: ./tests
      dockerfile: Dockerfile
    depends_on:
      - nginx # Ensure nginx starts before tests
    environment:
      - NODE_ENV=test
    command: ["npm", "test"]
    networks:
      - dev_network # Ensure tests and nginx are on the same network

networks:
  dev_network:
    driver: bridge # Ensure the network is created and used
healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:80/fetch"]
  interval: 10s
  retries: 5
  start_period: 10s
  timeout: 5s
